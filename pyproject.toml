# Refs:
# - https://peps.python.org/pep-0621/#example
# - https://setuptools.pypa.io/en/latest/userguide/package_discovery.html

[project]
name='climate-dt-workflow'
# TODO: sync it with branches?
version = '1.0'
description = 'Climate DT Workflow'
readme = 'README.md'
requires-python = '>=3.9'
license = { 'text' = 'Confidential' }
keywords = ['climate-dt', 'workflow', 'climate', 'digital twin']
# TODO: For later; maybe add contact points for the workflow devs here?
# authors = [
#    {email = '', name= ''}
# ]
# maintainers = [
#    {email = '', name = ''}
# ]
classifiers = []

dependencies = [
    # TODO: In theory Climate DT workflow depends on a version of Autosubmit,
    #       but right now we only want to add Python tests, thus the comment.
    #'autosubmit >= 4.0.105',
    'pyyaml == 6.*',
    'click >= 8.0',
    'pydantic >= 2.0',
    'loguru >= 0.6',
    'rich >= 13.0',
    'jinja2 >= 3.0',
]

[project.optional-dependencies]
test = [
    'pytest==8.*',
    'pytest-cov',
    'pytest-mock',
    'ruff',
    'pre-commit',
    'ruamel.yaml',
]

docs = [
    'sphinx==8.*',
    'sphinx_rtd_theme',
    'sphinx_mdinclude'
]

gitlab = [
    'python-gitlab >= 4.0',
]

mcp = [
    'fastmcp',
    'climate-dt-workflow[gitlab]',
]

all = ['climate-dt-workflow[test,docs,gitlab,mcp]']

[project.urls]
homepage = 'https://github.com/DestinE-Climate-DT/Workflow'
documentation = 'https://earth.bsc.es/gitlab/digital-twins/de_340/workflow/-/tree/main/docs'
repository = 'https://earth.bsc.es/gitlab/digital-twins/de_340/workflow'
changelog = 'https://earth.bsc.es/gitlab/digital-twins/de_340/workflow/-/blob/main/CHANGELOG.md'

[project.scripts]
destine = "wftools.cli.main:cli"

[build-system]
# Need >= 61 so `[tool.setuptools.package-data]` in pyproject.toml is
# honoured at wheel-build time (older setuptools silently ignores it,
# leaving the tsuite_pipeline templates out of the wheel).
requires = [
    'setuptools >= 61.0',
    'wheel'
]
build-backend = 'setuptools.build_meta'

[tool.setuptools]
# Ship non-.py files listed in MANIFEST.in (tsuite skeleton + shell templates).
# Belt+braces for old setuptools that ignore [tool.setuptools.package-data].
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["wftools*", "conf*", "runscripts*", "utils*"]

[tool.setuptools.package-data]
# Explicit per-subpackage globs so setuptools ships them into the wheel.
# The templates dir has its own (empty) __init__.py so setuptools treats it
# as a package -- otherwise non-Python files under it are dropped from the
# wheel even with include-package-data=true.
"wftools.tsuite_pipeline" = ["skeleton.yml"]
"wftools.tsuite_pipeline.templates" = ["*.sh", "*.j2"]

[tool.pytest.ini_options]
addopts = '--verbose'
testpaths = [
    'tests/bats_tests/',
    'tests/unit/',
]
markers = []

[tool.coverage.run]
# Jinja compiles the tsuite shell templates into Python code objects tagged with
# the .sh.j2 path, so coverage records execution against these non-Python files;
# keep them out of measurement (coverage.py 7.15.1 crashes tokenizing them).
omit = [
    "*/tsuite_pipeline/templates/*",
    "*.sh.j2",
]

[runners]
  output_limit = 8388608  # Double the limit (8MB)
