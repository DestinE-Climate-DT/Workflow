JOBS:
  WIPE_CHECK:
    FILE: templates/wipe-check.sh
    PLATFORM: '%DEFAULT.HPCARCH%-transfer'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES:
      REMOTE_SETUP:
      TRANSFER+10:
      LRA_GENERATOR+1:
      APP_WILDFIRES_FWI:
      APP_WILDFIRES_WISE:
      APP_ENERGY_INDICATORS:
      APP_OBSALL:
      APP_HYDROLAND:
      APP_HYDROMET:
    RUNNING: chunk
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
    RETRIALS: 0
    NOTIFY_ON: FAILED
  WIPE:
    FILE: templates/wipe.sh
    PLATFORM: "%DEFAULT.HPCARCH%"
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES:
      WIPE_CHECK: {}
      DQC_FULL:
        STATUS: FAILED
    RUNNING: chunk
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
    RETRIALS: 0
    NOTIFY_ON: FAILED
EXPERIMENT:
  SPLITSIZEUNIT: day # default CHUNKSIZEUNIT-1 (month-1 == day)
  # Split size. NUMERIC: 4, 6, 12
  SPLITSIZE: 2
  # Split policy. STRING: flexible, strict
  SPLITPOLICY: flexible
CONFIGURATION:
  WIPE:
    DOIT: "False"
    UNSAFE: "False"
  GENERATE_PROFILES: "True"
REQUEST:
  BRIDGE_EXPVER: "%DEFAULT.EXPID%"
PLATFORMS:
  MARENOSTRUM5:
    SYNC_DATAMOVER: "True"
