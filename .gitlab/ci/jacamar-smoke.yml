# Smoke tests for Jacamar runner on the ClimateDT VM.
# These validate that the user triggering the pipeline has
# the necessary environment, credentials, and access.
.jacamar-id-token:
  id_tokens:
    CI_JOB_JWT:
      aud: https://gitlab.earth.bsc.es
.jacamar-defaults:
  extends: .jacamar-id-token
  tags: [jacamar]
  stage: smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      module use /appl/AS/modules
      if ! command -v python3 &>/dev/null; then
        echo "ERROR: python3 not found on this runner"; exit 1
      fi
      # Install wftools (provides the destine CLI) via shared script.
      source .gitlab/ci/install-destine.sh
      mkdir -p reports
identity-env-check:
  extends: .jacamar-defaults
  variables:
    # Override to pin a specific version, e.g. "autosubmit/4.1.16.1"
    # AUTOSUBMIT_VERSION: "4.1.16.1" # [TODO] Should be same as in baseline check to ensure no differences...?
    AUTOSUBMIT_VERSION: ""
  script:
    - |
      echo "=== Identity ==="
      echo "User: $(whoami)"
      echo "Hostname: $(hostname)"
      echo "Home: $HOME"
      echo ""

      echo "=== MODULEPATH ==="
      echo "$MODULEPATH" | tr ":" "\n"
      echo "=== Autosubmit ==="
      # Load the requested version, or fall back to the default module
      if [ -n "$AUTOSUBMIT_VERSION" ]; then
        echo "Loading requested version: $AUTOSUBMIT_VERSION"
        if ! module load "$AUTOSUBMIT_VERSION"; then
          echo "ERROR: Failed to load module $AUTOSUBMIT_VERSION"
          destine report add identity_autosubmit fail
          destine report generate reports/smoke-identity.xml
          exit 1
        fi
      else
        echo "Loading default autosubmit module"
        if ! module load autosubmit; then
          echo "ERROR: Failed to load module autosubmit"
          destine report add identity_autosubmit fail
          destine report generate reports/smoke-identity.xml
          exit 1
        fi
      fi
      echo "Loaded: $(autosubmit --version 2>&1)"
      echo "Path:   $(which autosubmit)"
      destine report add identity_autosubmit pass
      if ls -ld /appl/AS/AUTOSUBMIT_DATA/ 2>/dev/null; then
        echo "AUTOSUBMIT_DATA accessible"
        destine report add identity_autosubmit_data pass
      else
        echo "WARNING: /appl/AS/AUTOSUBMIT_DATA/ not accessible"
        destine report add identity_autosubmit_data fail
        exit 1
      fi

      destine report generate reports/smoke-identity.xml
  artifacts:
    expire_in: 14d
    when: always
    reports:
      junit: reports/smoke-identity.xml
token-check-lumi-o:
  extends: .jacamar-defaults
  allow_failure: true
  script:
    - |
      failed=0
      if ./tests/check-token-lumi-o.sh; then
        destine report add token_lumi_o pass
      else
        destine report add token_lumi_o fail
        failed=1
      fi
      destine report generate reports/smoke-lumi-o.xml
      [ "$failed" -eq 0 ]
  artifacts:
    expire_in: 14d
    when: always
    reports:
      junit: reports/smoke-lumi-o.xml
