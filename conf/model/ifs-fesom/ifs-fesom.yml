MODEL:
  # Place-holders to modify MIR_CACHE_PATHs via main.yml. Leave these parameters empty
  # to use the default values defined by RAPS. Defining these parameters via the
  # main.yml might not have an effect in all HPCs. It currently works in: LUMI, MN5
  RAPS_MIR_CACHE_PATH:
  RAPS_MIR_FESOM_CACHE_PATH:
  RAPS:
    GENERAL_FLAGS: "--ifs-bundle-build-dir --icmcl %^MODEL.ICMCL_PATTERN% -R --deep "
    FESOM_FLAGS: "--fesom --nonemopart "
    RESTART_FLAGS: "--restartdirectory=%^CONFIGURATION.RESTART_DIR% --keeprestart "
    FDB_FLAGS: "--keepfdb --multio-production-fdbs=%^MODEL.FDB_DIRS% --outexp=%^REQUEST.EXPVER% --generation=%REQUEST.GENERATION% "
    IO_FLAGS: "--keepnetcdf --nextgemsout=6 --wam-multio --ifs-multio "
    NAMELIST_FLAGS: "--inproot-namelists "
  FDB_DIRS: "%^REQUEST.FDB_HOME%/native:%^REQUEST.FDB_HOME%:%^REQUEST.FDB_HOME%/latlon"
REQUEST:
  MODEL: ifs-fesom
  MODEL_NAME_UPPER: IFS-FESOM
PLATFORMS:
  LUMI:
    RAPS_HOST_CPU: lum-c
    RAPS_HOST_GPU: lum-g
    RAPS_BIN_HPC_NAME: lumi
    RAPS_COMPILER: cce
    # Exports this value as mpilib for RAPS. It doesn't really switch the MPI lib
    # and it neither affects the name of the rundir (mpilib hard-coded in RAPS for lumi)
    RAPS_MPILIB: cray-mpich
  MARENOSTRUM5:
    RAPS_HOST_CPU: mn5-gpp
    RAPS_HOST_GPU:
    RAPS_BIN_HPC_NAME: mn5
    RAPS_COMPILER: intel
    # Exports this value as mpilib for RAPS. It doesn't really switch the MPI lib
    # but it affects the name of the rundir (e.g.
    # `rundir/tco79l137/t02k/hres/intel.openmpi`)
    RAPS_MPILIB: openmpi
PERFORMANCE_METRICS:
  COMPLEXITY:
    IFS: 10
    NEMO: 50
CONFIGURATION:
  GENERATE_PROFILES: "True"
  ADDITIONAL_JOBS:
    FIX_CONSTANT_VARIABLES: "True"
  FESOM_PERTURB: "false"
  FESOM_PERTURBATION_SEED_BASE: "50000"
