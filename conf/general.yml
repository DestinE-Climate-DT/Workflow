# Workflow configuration
CONFIGURATION:
  CONTAINER_DIR_DEV: "%CONFIGURATION.HPC_PROJECT_DIR%/containers"
  PROJECT_SCRATCH: "%CURRENT_SCRATCH_DIR%/%CURRENT_PROJECT%"
  DEVELOPMENT_PROJECT_SCRATCH: "%CURRENT_SCRATCH_DIR%/%CURRENT_DEVELOPMENT_PROJECT%"
  OPERATIONAL_PROJECT_SCRATCH: "%CURRENT_SCRATCH_DIR%/%CURRENT_OPERATIONAL_PROJECT%"
  PROJECT_ROOTDIR: "%CURRENT_ROOTDIR%/%PROJECT.PROJECT_DESTINATION%"
  LIBDIR: "%CONFIGURATION.PROJECT_ROOTDIR%/lib"
  SCRIPTDIR: "%CONFIGURATION.PROJECT_ROOTDIR%/runscripts"
  HPC_PROJECT_DIR: "%CURRENT_HPC_PROJECT_ROOT%/%CURRENT_PROJECT%"
  FDB_DIR: "%CURRENT_SCRATCH_DIR%/%CURRENT_PROJECT%/experiments"
  DQC_PROFILE_ROOT: "%CURRENT_ROOTDIR%/profiles"
  DQC_PROFILE_PATH: "%CONFIGURATION.DQC_PROFILE_ROOT%/%REQUEST.MODEL%"
  FDB_CONFIG_HPC: "%CURRENT_FDB_PROD%/etc/fdb/config.yaml"
  FDB_CONFIG_DATABRIDGE: "%CURRENT_DATABRIDGE_FDB_HOME%/etc/fdb/config.yaml"
  FDB_CONFIG_GATEWAY: "%CURRENT_GATEWAY_FDB_HOME%/etc/fdb/config.yaml"
  RUNDIR_PATH: "%HPCROOTDIR%/rundir/%SDATE%/%MEMBER%"
  RUNDIR_BACKUP_PATH: "%CONFIGURATION.HPC_PROJECT_DIR%/backup/%DEFAULT.EXPID%/rundir/%SDATE%/%MEMBER%"
  RESTARTS_BACKUP_PATH: "%CURRENT_HPC_PROJECT_ROOT%/%CURRENT_PROJECT%/restart_backups"
  PRE_RESTART_DIR: "%HPCROOTDIR%/restarts/%SDATE%/%MEMBER%"
  RESTART_DIR: "%CONFIGURATION.PRE_RESTART_DIR%/current"
  HPC_LOG_DIR: "%HPCROOTDIR%/LOG_%DEFAULT.EXPID%"
TOOLS:
  VERSION: "latest"
BASE:
  VERSION: "latest"
ENSEMBLES:
  VERSION: "latest"
PERFORMANCE_METRICS:
  VERSION: "latest"
# Autosubmit placeholders that will not be interpolated
CONFIG:
  SAFE_PLACEHOLDERS:
    - FT
    - ft
