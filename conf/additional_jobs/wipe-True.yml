JOBS:
  WIPE_CHECK:
    FILE: templates/wipe-check.sh
    PLATFORM: '%DEFAULT.HPCARCH%-transfer'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: TRANSFER WIPE-1
    RUNNING: chunk
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
    NOTIFY_ON: FAILED
  WIPE:
    FILE: templates/wipe.sh
    PLATFORM: "%DEFAULT.HPCARCH%"
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: REMOTE_SETUP WIPE_CHECK
    RUNNING: chunk
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
    NOTIFY_ON: FAILED
EXPERIMENT:
  SPLITSIZEUNIT: day # default CHUNKSIZEUNIT-1 (month-1 == day)
  # Split size. NUMERIC: 4, 6, 12
  SPLITSIZE: 2
  # Split policy. STRING: flexible, strict
  SPLITPOLICY: flexible
CONFIGURATION:
  WIPE:
    DOIT: "False"
  GENERATE_PROFILES: "True"
REQUEST:
  BRIDGE_EXPVER: "%DEFAULT.EXPID%"
