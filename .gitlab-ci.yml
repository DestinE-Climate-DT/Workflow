default:
  tags:
    - de340_2_workflow
  id_tokens:
    CI_JOB_JWT:
      aud: https://gitlab.earth.bsc.es
workflow:
  # One pipeline per change: MR if an MR is open, else branch; plus tags.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
stages:
  - lint
  - test
  - mirror
variables:
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: none
  SOURCE_BRANCH: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  TARGET_BRANCH: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  RUNNING_BRANCH: $CI_COMMIT_REF_NAME
shellcheck:
  stage: lint
  # Official image, project source code: https://github.com/koalaman/shellcheck
  image: koalaman/shellcheck-alpine:stable
  before_script:
    - shellcheck --version
  script:
    - find lib -name "*.sh" -exec shellcheck --severity error '{}' +;
    - find templates -name "*.sh" -exec shellcheck --severity error '{}' +;
    - find runscripts -name "*.sh" -exec shellcheck --severity error '{}' +;
shfmt:
  stage: lint
  # Official image, project source code: https://github.com/mvdan/sh
  image: mvdan/shfmt:latest-alpine
  before_script:
    - shfmt --version
  script:
    - find templates -name "*.sh" -exec shfmt --diff -i 4 '{}' +;
    - find lib -name "*.sh" -exec shfmt --diff -i 4 '{}' +;
    - find runscripts -name "*.sh" -exec shfmt --diff -i 4 '{}' +;
yamllint:
  stage: lint
  # Non-official image, maintained by GitLab: https://gitlab.com/pipeline-components/yamllint
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  script:
    - yamllint -c .yamllint .
yamlfmt:
  stage: lint
  # Official image from Google: https://github.com/google/yamlfmt
  image: ghcr.io/google/yamlfmt:latest
  script:
    - yamlfmt -lint .
ruff:
  stage: lint
  # Non-official image, project source code: https://github.com/astral-sh/ruff
  # N.B.: They use "FROM scratch" and copy only the `ruff` binary to `/ruff`.
  #       `/ruff` is then used as entrypoint. This does not work with older
  #       versions of Docker, and complicates using GitLab.
  image: pipelinecomponents/ruff:latest
  before_script:
    - ruff --version
  script:
    - ruff check lib
    - ruff check utils
    - ruff check runscripts
    - ruff format --check lib
    - ruff format --check utils
    - ruff format --check runscripts
templates_numeration:
  stage: lint
  # Official python image, https://hub.docker.com/_/python
  image: python:3.9-alpine
  script:
    - pip install .[test] && python utils/templates_numeration.py
test-python:
  stage: test
  # gsv image, list of included packages: https://github.com/DestinE-Climate-DT/ContainerRecipes/pkgs/container/gsv#container-definitions-and-software
  image: ghcr.io/destine-climate-dt/gsv:2.9.0_fdb-5.12.1_eccodes-2.39.0_python-3.11_ubuntu-22.04_8dbc13ec4e39
  script:
    # PyYaml build issues...
    # Ref: https://github.com/yaml/pyyaml/issues/736#issuecomment-1656557056
    - pip install .[test] && pytest tests/bats_tests --cov
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  # These artifacts are saved with every build in GitLab and can be reviewed later. If
  # we have a folder with HTML files, as in this example, users can navigate with their
  # browser.
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: tests/bats_tests/coverage.xml
test-shell:
  image: kinow/bats-kcov:latest
  script:
    - /usr/local/bin/bats --verbose-run --recursive ./
coverage-shell:
  image: kinow/bats-kcov:latest
  # Run kcov on the test scripts
  script:
    - /usr/local/bin/kcov --include-path=./ --dump-summary ./coverage/ /usr/local/bin/bats --recursive ./
  # These artifacts are saved with every build in GitLab and can be reviewed later
  artifacts:
    expire_in: 1 hour
    paths:
      - ./coverage/
test-preflight:
  stage: test
  image: autosubmit/autosubmit:4.1.16.1-bullseye-slim
  script:
    - |
      sudo apt-get update
      sudo apt-get -yq install make wget unzip
      sudo apt-get -yq install pipx
      pipx ensurepath
      autosubmit install
      export USER=autosubmit
      make install-yq
      make install-jsonschema
      make test-schema
baseline-test:
  stage: test
  image: autosubmit/autosubmit:4.1.16.1-bullseye-slim
  allow_failure: true
  rules:
    # Only in MR pipelines, so the diff uses the MR's real target, not main.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pwd
    - echo "machine gitlab.earth.bsc.es login gitlab-ci-token password $CI_JOB_TOKEN" >> ~/.netrc
    - echo "Test inside the container"
    - autosubmit install
    - export USER=autosubmit
    - autosubmit --version
    - pip install pyyaml
    - pip install colorama
    - pip install pyyaml
    - echo "SOURCE_BRANCH $SOURCE_BRANCH"
    - echo "TARGET_BRANCH $TARGET_BRANCH"
    - echo "RUNNING_BRANCH $RUNNING_BRANCH"
    - echo "CI_MERGE_REQUEST_TARGET_BRANCH_NAME $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - echo "CI_COMMIT_REF_NAME $CI_COMMIT_REF_NAME"
    - cd tests/workflow_mock && python3 run_baseline_tests.py --target_branch="$TARGET_BRANCH" --source_branch="$SOURCE_BRANCH" --running_branch="$RUNNING_BRANCH"
    # Disable the unnecessary jobs to reduce CI/CD resource usage
    #
    #docs:
  # Official image, project source code: https://github.com/sphinx-doc/sphinx/
  # TODO: publish the generated files somewhere?
#  image: sphinxdoc/sphinx:latest
#  stage: docs
#  script:
#    - make docs-html
# latex:
#  image: sphinxdoc/sphinx-latexpdf
#  stage: docs
#  script:
#    - pip install .[docs]
#    - sed -i 's/✅/yes/g' docs/source/schemas/*.md
#    - cd docs && make latexpdf
mirror_releases:
  stage: mirror
  image: ubuntu:latest
  needs:
    # baseline-test runs only in MR pipelines, so it is absent on tag pipelines.
    - job: baseline-test
      optional: true
    - coverage-shell
    - test-python
    - test-shell
    - test-preflight
  before_script:
    - apt-get update && apt-get install -y git curl ca-certificates
    - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    - apt-get update && apt-get install -y gh
    - git config --global user.email "ci@example.com"
    - git config --global user.name "GitLab CI"
  variables:
    GITHUB_REPO: "DestinE-Climate-DT/Workflow"
  #  CI_COMMIT_TAG: "v5.2.3" # Can be overridden when running the pipeline
  script:
    - echo "$(echo -n $GH_PAT | wc -c)"
    # Create an orphan branch to avoid history
    - git checkout --orphan mirror-temp
    # Add all current files
    - git add -A
    - git commit -m "Mirror commit for $CI_COMMIT_TAG"
    # Tag the commit
    - git tag -f $CI_COMMIT_TAG
    # Add GitHub remote
    - git remote add github https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPO}.git
    # Push only the tag (no history)
    - git push github refs/tags/$CI_COMMIT_TAG --force
    # create new release on github with gh client
    - GH_TOKEN=$GH_PAT gh release create "$CI_COMMIT_TAG" --repo "$GITHUB_REPO" --title "Release $CI_COMMIT_TAG" --notes "Release Version $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG
  # when: manual
