ssh-check-lumi-to-mn5:
  extends: .jacamar-defaults
  allow_failure: true
  # This job tests the LUMI → MN5 cross-HPC SSH hop.
  # Prerequisites on LUMI (see tests/check-ssh-lumi-to-mn5.sh for details):
  #   1. SSH key pair for MN5 exists on LUMI, e.g. ~/.ssh/id_ed25519_bsc
  #   2. The public key is in MN5's ~/.ssh/authorized_keys
  #      (run on MN5: ssh-copy-id -i ~/.ssh/id_ed25519_bsc.pub <bsc_user>@glogin1.bsc.es)
  needs: [ssh-check-lumi]
  variables:
    LUMI_HOST: "lumi-cluster"
    # Host alias as defined in LUMI's ~/.ssh/config — this ensures the correct
    # User and IdentityFile are used, matching what you get when you manually
    # run 'ssh mn5-cluster1' from LUMI.  Set to glogin1.bsc.es if no alias
    # is configured in LUMI's ~/.ssh/config.
    MN5_FROM_LUMI_HOST: "mn5-cluster1"
  script:
    - |
      failed=0
      if LUMI_HOST="$LUMI_HOST" MN5_FROM_LUMI_HOST="$MN5_FROM_LUMI_HOST" \
           ./tests/check-ssh-lumi-to-mn5.sh; then
        destine report add ssh_lumi_to_mn5 pass
      else
        destine report add ssh_lumi_to_mn5 fail
        failed=1
      fi
      destine report generate reports/smoke-ssh-lumi-to-mn5.xml
      [ "$failed" -eq 0 ]
  artifacts:
    expire_in: 14d
    when: always
    reports:
      junit: reports/smoke-ssh-lumi-to-mn5.xml
