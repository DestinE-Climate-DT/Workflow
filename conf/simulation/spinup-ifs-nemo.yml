## In this file we define the configurations used in the SPINUP runs, being defined as a CONTROL run
EXPERIMENT:
  DATELIST: 19880101
  MEMBERS: fc0
  CALENDAR: standard
JOBS:
  SIM:
    RETRIALS: 1
    WALLCLOCK: "%WALLCLOCKS.MONTHLY%"
CONFIGURATION:
  DATA_PORTFOLIO: "full"
  RAPS:
    FORCING_SSP: "SSP370"
    FIXYEAR: 1990
MODEL:
  RAPS:
    # ------------------------
    # --- Scientific flags ---
    # ------------------------
    # --teos10 : activate the TEOS10 instead of EOS80
    # --sicoupl="fractional" : using fractional seaice coupling (old --sicoupl=1)
    # --no-ozone : turn ozone handling off
    USER_SIM_SCI_FLAGS: ""
REQUEST:
  EXPERIMENT: "cont"
  ACTIVITY: "baseline"
  GENERATION: 2
  REALIZATION: 1
