RUN:
  WORKFLOW: model
  # Platform-dependent: in LUMI, it should be "cray"
  ENVIRONMENT: intel
  PROCESSOR_UNIT: cpu
  TYPE: research
MODEL:
  NAME: ifs-nemo
  SIMULATION: test-ifs-nemo
  GRID_ATM: tco79l137
  GRID_OCE: eORCA1_Z75
  DVC_INPUTS_BRANCH: ClimateDT-phase2
  INPUTS: '%HPCROOTDIR%/%PROJECT.PROJECT_DESTINATION%/dvc-cache-de340'
EXPERIMENT:
  DATELIST: 19900101 20200101 #Startdate
  MEMBERS: fc0
  CHUNKSIZEUNIT: month
  CHUNKSIZE: 1
  NUMCHUNKS: 2
  CALENDAR: standard
CONFIGURATION:
  DATA_PORTFOLIO: full
  RAPS_USER_FLAGS: --inproot-namelists
  ADDITIONAL_JOBS:
    TRANSFER: 'True'
    BACKUP: 'False'
    WIPE: 'True'
    MEMORY_CHECKER: 'True'
    DQC: 'True'
    CLEAN: 'True'
  WIPE:
    DOIT: 'True'
    UNSAFE: 'True'
JOBS:
  TRANSFER:
    WALLCLOCK: '01:30'
