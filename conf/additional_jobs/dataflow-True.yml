JOBS:
  CREATE_ZARR:
    FILE: templates/dataflow/create_zarr.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: REMOTE_SETUP
    RUNNING: chunk
    WALLCLOCK: '03:00'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  CREATE_ANEMOI_DS_CONFIG:
    FILE: templates/dataflow/create_anemoi_config.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: CREATE_ZARR
    RUNNING: date
    WALLCLOCK: '03:00'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  INIT_ANEMOI_DS:
    FILE: templates/dataflow/init_anemoi-ds.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: CREATE_ANEMOI_DS_CONFIG
    RUNNING: date
    WALLCLOCK: '03:00'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  BUILD_REQUESTS:
    FILE: templates/dataflow/build_requests.sh
    PLATFORM: "%DEFAULT.HPCARCH%"
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: INIT_ANEMOI_DS
    RUNNING: chunk
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  GENERATE_DATASETS:
    FILE: templates/dataflow/generate_dataset.sh
    PLATFORM: "%DEFAULT.HPCARCH%"
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: BUILD_REQUESTS DOWNLOAD_DATA
    RUNNING: chunk
    SPLITS: 'auto'
    SPLITSIZE: 1
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  LOAD_PART_ANEMOI_DS:
    FILE: templates/dataflow/load_anemoi.sh
    PLATFORM: "%DEFAULT.HPCARCH%"
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES:
      GENERATE_DATASETS:
        SPLITS_FROM:
          all:
            SPLITS_TO: '[1:auto]*\1'
    RUNNING: chunk
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  FINALISE_ANEMOI_DS:
    FILE: templates/dataflow/finalise_anemoi-ds.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: LOAD_PART_ANEMOI_DS
    RUNNING: date
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  ADDITIONAL_STATISTICS:
    FILE: templates/dataflow/additional_statistics.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: FINALISE_ANEMOI_DS
    RUNNING: date
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  CLEANUP_ANEMOI_DS:
    FILE: templates/dataflow/cleanup_anemoi-ds.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: ADDITIONAL_STATISTICS
    RUNNING: date
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
EXPERIMENT:
  SPLITSIZEUNIT: day # default CHUNKSIZEUNIT-1 (month-1 == day)
  # Split size. NUMERIC: 4, 6, 12
  SPLITSIZE: 5
  # Split policy. STRING: flexible, strict
  SPLITPOLICY: flexible
CONFIGURATION:
  DATAFLOW:
    CONTAINER_DIR: "/gpfs/projects/ehpc01/containers/de393/container_earthkitdata_0_13_6.sif"
    REQUESTS_DIR: "%HPCROOTDIR%/requests/generated"
    REPOSITORY_DIR: "%HPCROOTDIR%/%PROJECT.PROJECT_DESTINATION%/data_pipelines"
    OUTPUT_DIR: "%HPCROOTDIR%/dataflow_output"
    TARGET_RES: "H128"
    TARGET_GRID: "healpix"
PLATFORMS:
  MARENOSTRUM5:
    ANEMOI_CONTAINER: "/gpfs/projects/ehpc165/containers/anemoi-containers/anemoi-250606.sif"
