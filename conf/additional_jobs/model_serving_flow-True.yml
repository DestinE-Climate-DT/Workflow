JOBS:
  INFERENCE:
    FILE: templates/dataflow/inference.sh
    PLATFORM: MARENOSTRUM5-ACCELERATED
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: CLEANUP_ANEMOI_DS REMOTE_SETUP
    RUNNING: date
    WALLCLOCK: '00:30'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  POSTPROCESS_INFERENCE:
    FILE: templates/dataflow/postprocess_inference.sh
    PLATFORM: MARENOSTRUM5
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: INFERENCE
    RUNNING: date
    WALLCLOCK: '00:20'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  EVALUATION_SETUP:
    FILE: templates/dataflow/evaluation_setup.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: POSTPROCESS_INFERENCE
    RUNNING: date
    WALLCLOCK: '00:10'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  GEN_AQUA_CATALOG:
    FILE: templates/dataflow/gen_aqua_catalog.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: EVALUATION_SETUP
    RUNNING: date
    WALLCLOCK: '00:10'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
  EVALUATION:
    FILE: templates/dataflow/evaluation.sh
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: "%CURRENT_APP_PARTITION%"
    DEPENDENCIES: GEN_AQUA_CATALOG
    RUNNING: date
    WALLCLOCK: '01:00'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
CONFIGURATION:
  GENERATE_PROFILES: "False"
  MODEL_SERVING_FLOW:
    REPOSITORY_DIR: "%HPCROOTDIR%/%PROJECT.PROJECT_DESTINATION%/model_serving_flow"
    UTILS_LIB_DIR: "%CONFIGURATION.LIBDIR%/common/utils/dataflow"
    CHECKPOINT:
      FILE: /gpfs/scratch/pred1/bsc032519/model_checkpoints/inference-anemoi-by_step-epoch_026-step_074500.ckpt
      EPOCH: "026"
      STEP: "074500"
    EVALUATION:
      ADD_CATALOG_NAME: "model_serving_flow_catalog"
      REFERENCE_DATA:
        CATALOG: CMIP6_interExtrapolation
        MODEL: UKESM1
        EXPERIMENT: ssp245
        SOURCE: r1i1p1f2
      PREDICTIONS_DATA:
        CATALOG: CMIP6_interExtrapolation
        MODEL: auto_emulator_output
        EXPERIMENT: predictions
    INFERENCE_OUTPUT_SUBFOLDER: "inference_output/data"
    INFERENCE_OUTPUT_PROCESSED_SUBFOLDER: "inference_output/postproc_data"
    EVALUATION_OUTPUT_SUBFOLDER: "evaluation_output"
    AQUA_CONFIG_SUBFOLDER: "aqua"
    RUNS_DIR: "%HPCROOTDIR%/runs/%CHUNK_START_DATE%"
    ACTIVE_RUN_DIR_SYMLINK: "%CONFIGURATION.MODEL_SERVING_FLOW.RUNS_DIR%/active"
    INFERENCE_OUTPUT_DIR: "%CONFIGURATION.MODEL_SERVING_FLOW.ACTIVE_RUN_DIR_SYMLINK%/%CONFIGURATION.MODEL_SERVING_FLOW.INFERENCE_OUTPUT_SUBFOLDER%"
    INFERENCE_OUTPUT_PROCESSED_DIR: "%CONFIGURATION.MODEL_SERVING_FLOW.ACTIVE_RUN_DIR_SYMLINK%/%CONFIGURATION.MODEL_SERVING_FLOW.INFERENCE_OUTPUT_PROCESSED_SUBFOLDER%"
    EVALUATION_OUTPUT_DIR: "%CONFIGURATION.MODEL_SERVING_FLOW.ACTIVE_RUN_DIR_SYMLINK%/%CONFIGURATION.MODEL_SERVING_FLOW.EVALUATION_OUTPUT_SUBFOLDER%"
    AQUA_CONFIG_DIR: "%CONFIGURATION.MODEL_SERVING_FLOW.ACTIVE_RUN_DIR_SYMLINK%/%CONFIGURATION.MODEL_SERVING_FLOW.AQUA_CONFIG_SUBFOLDER%"
WRAPPERS:
  WRAPPER_V: # wraps jobs after inference, which are all run in MN5-GPP
    TYPE: "vertical"
    JOBS_IN_WRAPPER: "POSTPROCESS_INFERENCE EVALUATION_SETUP GEN_AQUA_CATALOG EVALUATION"
PLATFORMS:
  MARENOSTRUM5:
    CONTAINERS_PATH: "/gpfs/scratch/pred1/model_serving_flow/containers"
    ANEMOI_CONTAINER: "%PLATFORMS.MARENOSTRUM5.CONTAINERS_PATH%/anemoi-serving_latest.sif"
    AQUA_CONTAINER: "%PLATFORMS.MARENOSTRUM5.CONTAINERS_PATH%/aqua-eval_0.19.8.sif"
    AQUA_ROOT_PATH: "/gpfs/scratch/pred1/model_serving_flow/aqua"
    AQUA: "%PLATFORMS.MARENOSTRUM5.AQUA_ROOT_PATH%/AQUA_v0.19.8"
    AQUA_DIAGNOSTICS: "%PLATFORMS.MARENOSTRUM5.AQUA_ROOT_PATH%/AQUA-diagnostics"
    AQUA_CATALOG: "%PLATFORMS.MARENOSTRUM5.AQUA_ROOT_PATH%/AQUA_CATALOG"
    AQUA_PREDICTIA_REPO: "%PLATFORMS.MARENOSTRUM5.AQUA_ROOT_PATH%/AQUA-evaluation-framework"
  MARENOSTRUM5-LOGIN:
    ANEMOI_CONTAINER: "%PLATFORMS.MARENOSTRUM5.ANEMOI_CONTAINER%"
    AQUA_CONTAINER: "%PLATFORMS.MARENOSTRUM5.AQUA_CONTAINER%"
  LUMI: # TODO: fill in with actual paths when tested in LUMI
    ANEMOI_CONTAINER: "/lumi/path/to/anemoi/container.sif"
    AQUA_CONTAINER: "/lumi/path/to/aqua/container.sif"
  LUMI-LOGIN:
    ANEMOI_CONTAINER: "%PLATFORMS.LUMI.ANEMOI_CONTAINER%"
    AQUA_CONTAINER: "%PLATFORMS.LUMI.AQUA_CONTAINER%"
  MARENOSTRUM5-ACCELERATED:
    ANEMOI_CONTAINER: "%PLATFORMS.MARENOSTRUM5.ANEMOI_CONTAINER%"
    AQUA_CONTAINER: "%PLATFORMS.MARENOSTRUM5.AQUA_CONTAINER%"
    HOST: mn5-acc
    PROJECT: pred1 #Hardcoded for now, should be handeld by platform configuration in the main file or the platforms file
    DEVELOPMENT_PROJECT: "%PLATFORMS.MARENOSTRUM5.DEVELOPMENT_PROJECT%"
    OPERATIONAL_PROJECT: "%PLATFORMS.MARENOSTRUM5.OPERATIONAL_PROJECT%"
    HPC_PROJECT_ROOT: "%PLATFORMS.MARENOSTRUM5.HPC_PROJECT_ROOT%"
    HPC_EARTHKIT_REGRID_CACHE_DIR: "%PLATFORMS.MARENOSTRUM5.HPC_EARTHKIT_REGRID_CACHE_DIR%"
    MAX_WALLCLOCK: "%PLATFORMS.MARENOSTRUM5.MAX_WALLCLOCK%"
    MAX_PROCESSORS: "%PLATFORMS.MARENOSTRUM5.MAX_PROCESSORS%"
    PROCESSORS_PER_NODE: 80
    SCRATCH_DIR: "%PLATFORMS.MARENOSTRUM5.SCRATCH_DIR%"
    QUEUE: acc_debug
    TYPE: slurm
    EXCLUSIVE: "True"
    CUSTOM_DIRECTIVES: "['#SBATCH --gpus-per-node=4', '#SBATCH --hint=nomultithread', '#SBATCH --gres=gpu:1']"
    HPCARCH_short: "MN5-ACC"
    HPCARCH_lowercase: "marenostrum5-acc"
# Required items for passing cicd schemas, not used in this workflow
REQUEST:
  MODEL: ifs-nemo
  EXPERIMENT: "hist"
  ACTIVITY: "baseline"
  GENERATION: 2
  REALIZATION: 1
EXPERIMENT:
  NUMCHUNKS: 1
  CALENDAR: standard
  MEMBERS: fc0
