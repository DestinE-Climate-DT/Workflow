JOBS:
  AQUA_SETUP:
    DEPENDENCIES: REMOTE_SETUP
    FILE: templates/remote_setup/aqua_setup.sh,templates/aqua/config_catalog.yaml
    PLATFORM: '%DEFAULT.HPCARCH%-login'
    RUNNING: date
    WALLCLOCK: 00:10
    CHECK: on_submission
    NOTIFY_ON: FAILED
    TOTALJOBS: 1
  LRA_GENERATOR:
    DEPENDENCIES: AQUA_SETUP SIM DQC_BASIC
    FILE: templates/aqua/lra_generator.sh,templates/aqua/only_lra.yaml
    NODES: 1
    PROCESSORS: '%CURRENT_PROCESSORS_PER_NODE%'
    PARTITION: '%CURRENT_APP_PARTITION%'
    TASKS: 0
    THREADS: 1
    PLATFORM: '%DEFAULT.HPCARCH%'
    EXCLUSIVE: "True"
    RUNNING: chunk
    WALLCLOCK: 00:30
    FREQUENCY: 1
    CHECK: on_submission
    NOTIFY_ON: FAILED
  AQUA_ANALYSIS:
    DEPENDENCIES: LRA_GENERATOR
    FILE: templates/aqua/aqua_analysis.sh
    NODES: 1
    PROCESSORS: '%CURRENT_PROCESSORS_PER_NODE%'
    TASKS: 0
    THREADS: 1
    PARTITION: '%CURRENT_APP_PARTITION%'
    PLATFORM: '%DEFAULT.HPCARCH%'
    EXCLUSIVE: "True"
    RUNNING: chunk
    WALLCLOCK: 02:00
    FREQUENCY: 1
    CHECK: on_submission
    NOTIFY_ON: FAILED
  AQUA_PUSH:
    DEPENDENCIES: AQUA_SETUP AQUA_ANALYSIS
    FILE: templates/aqua/aqua_push.sh
    PLATFORM: local
    RUNNING: chunk
    WALLCLOCK: 02:00
    FREQUENCY: "%^JOBS.AQUA_ANALYSIS.FREQUENCY%"
    NOTIFY_ON: FAILED
    CONTAINER_DIR: "/appl/containers"
    PUSH_FIGURES: "true"
    PUSH_CATALOG: "true"
  REMOTE_SETUP:
    FILE: templates/remote_setup/remote_setup.sh
AQUA:
  CONTAINER_VERSION: "0.19.2"
  LOCAL_LRA_OUTPUT_PATH: "%APP.OUTPATH%/LRA/"
  CENTRAL_LRA_OUTPUT_PATH: "/appl/local/climatedt/data/AQUA/LRA/"
  INSTALL_DIR: "%HPCROOTDIR%/.aqua"
  # Need help with the variables
  VARS_SFC: "['tprate', '2t', 'skt', 'msl', 'tcc', 'sd', 'tciw', 'tclw', 'tsrwe', 'slhtf', 'ishf', 'snswrf', 'snlwrf', 'sdlwrf', 'sdswrf', 'tnswrf', 'tnlwrf', 'tdswrf', 'iews', 'inss', 'ie', '10u', '10v']"
  SOURCE_SFC: "hourly-%AQUA.RESOLUTION_ATM%-atm2d"
  WORKERS_SFC: 16
  VARS_PL: "['q', 't', 'u', 'v']"
  SOURCE_PL: "hourly-%AQUA.RESOLUTION_ATM%-atm3d"
  WORKERS_PL: 6
  VARS_HL: "[]"
  SOURCE_HL: hourly-native-hl
  WORKERS_HL: 0
  VARS_O2D: "['sithick', 'siconc', 'tos', 'sos', 'hc700m']"
  SOURCE_O2D: "daily-%AQUA.RESOLUTION_OCE%-oce2d"
  WORKERS_O2D: 12
  VARS_O3D: "['thetao', 'so']"
  SOURCE_O3D: "daily-%AQUA.RESOLUTION_OCE%-oce3d"
  WORKERS_O3D: 3
  VARS_SOL: "[]"
  SOURCE_SOL: hourly-native-sol
  WORKERS_SOL: 0
  FIXER_NAME: climatedt-phase2-production
  BUCKET: aqua-web
  REPOSITORY: "DestinE-Climate-DT/aqua-web"
  CARTOPY_DATA_DIR: "/opt/conda/share/cartopy"
APP:
  OUTPATH: "%HPCROOTDIR%/output"
