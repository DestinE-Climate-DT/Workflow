JOBS:
  TRANSFER:
    FILE: templates/transfer.sh
    PLATFORM: "%DEFAULT.HPCARCH%-transfer"
    DEPENDENCIES: REMOTE_SETUP SIM TRANSFER-1
    RUNNING: chunk
    RETRIALS: 5
    SPLITS: 'auto'
    WALLCLOCK: '04:00'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
    NOTIFY_ON: FAILED
EXPERIMENT:
  SPLITSIZEUNIT: day # default CHUNKSIZEUNIT-1 (month-1 == day)
  # Split size. NUMERIC: 4, 6, 12
  SPLITSIZE: 2
  # Split policy. STRING: flexible, strict
  SPLITPOLICY: flexible
CONFIGURATION:
  GENERATE_PROFILES: "True"
  TRANSFER:
    MODIFY_METADATA: "False"
    MODIFY_METADATA_FIELDS: "experimentVersionNumber=0001"
REQUEST:
  BRIDGE_EXPVER: "0001"

