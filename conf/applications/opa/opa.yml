# Options for different HPCs here
PLATFORMS:
  LUMI:
    OPA_CUSTOM_DIRECTIVES: '#SBATCH --mem=224G'
    OPA_EXCLUSIVE: False
    OPA_MAX_PROC: 3
    OPA_MP_PROC: 8
    OPA_PROCESSORS: "%PLATFORMS.LUMI.OPA_MAX_PROC%" # Should be removed after all OPA/APP jobs have been updated.
    OPA_PROCESSES: "%PLATFORMS.LUMI.OPA_MAX_PROC%"
  MARENOSTRUM5:
    OPA_CUSTOM_DIRECTIVES: ''
    OPA_EXCLUSIVE: False
    OPA_PROCESSORS: 112 # Should be removed after all OPA/APP jobs have been updated.
    OPA_PROCESSES: 112
    # OPA_processors =! max paral_proc because we need an exclusive node in mn5 and the way we have is to request all cores in the node.
    OPA_MAX_PROC: 3
    OPA_MP_PROC: 8
APP:
  OUTPATH: "%HPCROOTDIR%/output/"
# set opa retrials
# TODO: Gather these into an OPA: section
OPA_RETRIALS: 0
OPA_WALLCLOCK: '00:20'
OPA_LOG_LEVEL: "INFO"
