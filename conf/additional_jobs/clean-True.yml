JOBS:
  CLEAN:
    FILE: templates/clean.sh
    PLATFORM: "%DEFAULT.HPCARCH%"
    DEPENDENCIES: REMOTE_SETUP SIM
    RUNNING: chunk
    WALLCLOCK: '00:30'
    TASKS: 1
    THREADS: 12
    NODES: 1
    PARTITION: '%CURRENT_CLEAN_PARTITION%'
