ENERGY_INDICATORS:
  1:
    GSVREQUEST: #raw data
      # From <expid>/conf/main.yml:
      expver: t001
      # From user input <expid>/conf/request.yml:
      activity: baseline
      resolution: standard
      generation: 2
      realization: 1
      experiment: cont
      model: ifs-nemo
      # Hardcoded parameters:
      dataset: climate-dt
      class: d1
      type: fc
      stream: clte
      levtype: "hl"
      levelist: 100
      date: 19900101
      time: "0000/to/2300/by/0100"
      param: "v"
      grid: 1.0/1.0
      method: nn
    OPAREQUEST:
      # Hardcoded parameters
      variable: "v"
      stat: "raw"
      stat_freq: "hourly"
      output_freq: "daily"
      time_step: 60 # in minutes
