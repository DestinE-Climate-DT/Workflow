MODEL:
  RESOLUTION: "5km"
  GRID_OCE: eORCA12_Z75
  RAPS:
    # ------------------------
    # --- Scientific flags ---
    # ------------------------
    # --cbmf_reduced : activate the cloud base mass fixer
    USER_RESOL_SCI_FLAGS: "--cbmf_reduced"
    # -------------------------
    # --- Performance flags ---
    # -------------------------
    USER_RESOL_PERF_FLAGS: ""
CONFIGURATION:
  ICMCL: "monthly"
  DQC_PROFILE: production
  DQC_WALLCLOCK: "00:40"
  IFS:
    GTYPE: tco
    RESOL: 2559
    LEVELS: 137
    EXPVER: hzfy
    LABEL: LWDA
    IO_PPN: 16
    IO_NODES: "%CURRENT_IFS_IO_NODES%"
  NEMO:
    IO_PPN: 8
    IO_NODES: "%CURRENT_NEMO_IO_NODES%"
WALLCLOCKS:
  MONTHLY: "05:00"
  DAILY: "00:30"
EXPERIMENT:
  CHUNKSIZEUNIT: month
  CHUNKSIZE: 1
  # Setting 2 months for testing
  NUMCHUNKS: 2
PLATFORMS:
  LUMI:
    NODES: 210
    TASKS: 16
    THREADS: 8
    PROCESSORS_PER_NODE: 128
    # TODO CHECK
    IFS_IO_NODES: 40
    # TODO ADD
    NEMO_IO_NODES: 0
  MARENOSTRUM5:
    TASKS: 8
    THREADS: 14
    NODES: 260 # Resource configuration: Balance
    IFS_IO_NODES: 8
    NEMO_IO_NODES: 4
REQUEST:
  RESOLUTION: high
AQUA:
  RESOLUTION_ATM: hpz7
  RESOLUTION_OCE: hpz7
  GRID_OCE: eORCA12
PERFORMANCE_METRICS:
  RESOLUTION: "4.2E9"
