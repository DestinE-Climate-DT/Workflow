# In this file we define the configurations used in the SSP126 SCENARIO runs
EXPERIMENT:
  DATELIST: 20150101
  MEMBERS: fc0
  CALENDAR: standard
JOBS:
  SIM:
    RETRIALS: 1
    WALLCLOCK: "%WALLCLOCKS.MONTHLY%"
CONFIGURATION:
  IFS:
    START_DATE: "19880101"
  RAPS:
    FORCING_AEROSOLS: "aerosol_cams-extended-macv2sp-ssp126_climatology_CONFESS_1951-2100_4D.nc"
    FORCING_AEROSOLS_VOLCANIC: "cmip6_stratospheric_aerosol_aod_extend.dat"
    FORCING_GHG: "greenhouse_gas_timeseries_CMIP6_SSP126_CFC11equiv_47r1.nc"
    FORCING_OZONE: "cmip6-ozone-scenarios/SSP126"
    FIXYEAR: -1
MODEL:
  RAPS:
    # ------------------------
    # --- Scientific flags ---
    # ------------------------
    # --teos10 : activate the TEOS10 instead of EOS80
    # --sicoupl="fractional" : using fractional seaice coupling (old --sicoupl=1)
    # --no-ozone : turn ozone handling off
    # --inproot-namelists : using user defined input files/namelists instad of <model/RAPS/inputs>
    USER_SIM_SCI_FLAGS: ''
RUN:
  RESTARTED_RUN: "true"
  RESTART_FROM: "fill-me"
REQUEST:
  EXPERIMENT: "SSP1-2.6"
  ACTIVITY: "projections"
  GENERATION: 2
  REALIZATION: 1
