JOBS:
  APP_ENERGY_INDICATORS:
    FILE: templates/application.sh
    RUNNING: chunk
    WALLCLOCK: 00:20
    PLATFORM: '%DEFAULT.HPCARCH%'
    PARTITION: '%CURRENT_APP_PARTITION%'
    NODES: 1
    PROCESSORS: 1
    TASKS: 1
    THREADS: 1
    CHECK: on_submission
    NOTIFY_ON:
      - FAILED
    SPLITS: auto
    DEPENDENCIES:
      OPA_ENERGY_INDICATORS:
        SPLITS_FROM:
          ALL:
            SPLITS_TO: '[1:auto]*\1'
      APP_ENERGY_INDICATORS:
        SPLITS_FROM:
          ALL:
            SPLITS_TO: previous
      APP_ENERGY_INDICATORS-1: {}
    ADDITIONAL_FILES: []
  OPA_ENERGY_INDICATORS:
