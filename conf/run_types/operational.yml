MODEL:
  ROOT_PATH: "%CONFIGURATION.HPC_PROJECT_DIR%/%RUN.CYCLE%/models/%MODEL.NAME%"
  PATH: "%MODEL.ROOT_PATH%/%^MODEL.VERSION%"
  INPUTS: "%MODEL.ROOT_PATH%/%^MODEL.VERSION%/inidata"
  RAPS_MIR_CACHE_PATH: "%HPCROOTDIR%/multio_mir_cache"
  RAPS_MIR_FESOM_CACHE_PATH: "%MODEL.INPUTS%/multio_mir_cache/fesom"
CONFIGURATION:
  CONTAINER_DIR_OP: "%CONFIGURATION.HPC_PROJECT_DIR%/%RUN.CYCLE%/containers"
PLATFORMS:
  MARENOSTRUM5:
    PROJECT: ehpc123
    DATA_DIR: "/gpfs/scratch/ehpc01/input_data/"
    CONTAINER_DIR: "%CONFIGURATION.CONTAINER_DIR_OP%"
  MARENOSTRUM5-login:
    PROJECT: ehpc123
    CONTAINER_DIR: "%CONFIGURATION.CONTAINER_DIR_OP%"
  MARENOSTRUM5-transfer:
    # In the datamover, the container path follows the development path (common folder)
    CONTAINER_DIR: "%CONFIGURATION.CONTAINER_DIR_DEV%"
  LUMI:
    PROJECT: project_465001542
    DATA_DIR: "/appl/local/climatedt/input_data/"
    CONTAINER_DIR: "%CONFIGURATION.CONTAINER_DIR_OP%"
  LUMI-login:
    PROJECT: project_465001542
    CONTAINER_DIR: "%CONFIGURATION.CONTAINER_DIR_OP%"
  LUMI-transfer:
    PROJECT: project_465001542
    CONTAINER_DIR: "%CONFIGURATION.CONTAINER_DIR_OP%"
AQUA:
  FIXER_NAME: "climatedt-phase2-production"
  BUCKET: "aqua-web-operational"
  REPOSITORY: "DestinE-Climate-DT/aqua-web-operations"
  AWS_PROFILE: "operational"
APP:
  OUTPATH: "%HPCROOTDIR%/output"
REQUEST:
  DATASET: climate-dt
  STREAM: clte
  CLASS: "d1"
  FDB_HOME: "%CURRENT_FDB_PROD%"
  INFO_FILE_PATH: "%CURRENT_ROOTDIR%"
  INFO_FILE_NAME: "%REQUEST.INFO_FILE_PATH%/%DEFAULT.EXPID%.yaml"
APP_AUX_IN_DATA_DIR: "%CURRENT_PROD_APP_AUX_IN_DATA_DIR%"
HYDROLAND:
  IN_DATA_VERSION: "1.1"
HYDROMET:
  IN_DATA_VERSION: "1.2"
WILDFIRES_WISE:
  IN_DATA_VERSION: "1.1"
ENERGY_INDICATORS:
  IN_DATA_VERSION: "1.1"
WILDFIRES_FWI:
  IN_DATA_VERSION: "1.0"
OBSALL:
  IN_DATA_VERSION: "1.0"
DATA:
  IN_DATA_VERSION: "dev"
