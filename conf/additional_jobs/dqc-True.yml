JOBS:
  DQC_BASIC:
    FILE: templates/dqc.sh
    DEPENDENCIES:
      REMOTE_SETUP:
      GENERATE_PROFILES:
      SIM:
      FIX_CONSTANT_VARIABLES:
        CHUNKS_FROM:
          all:
            CHUNKS_TO: "none"
          1:
            CHUNKS_TO: "1"
    # Activates/deactivates checkers
    CHECK_STANDARD_COMPLIANCE: "True"
    CHECK_SPATIAL_COMPLETENESS: "True"
    CHECK_SPATIAL_CONSISTENCY: "True"
    CHECK_PHYSICAL_PLAUSIBILITY: "True"
    CHECK_NEGATIVE_SPACE: "False"
    RUNNING: chunk
    WALLCLOCK: "%CONFIGURATION.DQC_WALLCLOCK%"
    NODES: 1
    PARTITION: '%CURRENT_APP_PARTITION%'
    PLATFORM: '%DEFAULT.HPCARCH%'
    PROCESSORS: 1
    TASKS: 1
    THREADS: 16
    CHECK: on_submission
    NOTIFY_ON: FAILED
  DQC_FULL:
    DEPENDENCIES:
      DQC_BASIC:
        CHUNKS_FROM:
          all:
            CHUNKS_TO: "1"
    FILE: templates/dqc.sh
    # Activates/deactivates checkers
    CHECK_STANDARD_COMPLIANCE: "True"
    CHECK_SPATIAL_COMPLETENESS: "True"
    CHECK_SPATIAL_CONSISTENCY: "True"
    CHECK_PHYSICAL_PLAUSIBILITY: "True"
    CHECK_NEGATIVE_SPACE: "True"
    RUNNING: member
    WALLCLOCK: "%CONFIGURATION.DQC_WALLCLOCK%"
    NODES: 1
    PARTITION: '%CURRENT_APP_PARTITION%'
    PLATFORM: '%DEFAULT.HPCARCH%'
    PROCESSORS: 1
    TASKS: 1
    THREADS: 16
    CHECK: on_submission
    NOTIFY_ON: FAILED
CONFIGURATION:
  GENERATE_PROFILES: "True"
