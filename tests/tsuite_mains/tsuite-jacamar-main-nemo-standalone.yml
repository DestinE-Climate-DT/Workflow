RUN:
  WORKFLOW: model
  ENVIRONMENT: intel
  TYPE: test
  PROCESSOR_UNIT: cpu
MODEL:
  SIMULATION: test-nemo
  NAME: nemo
  GRID_OCE: eORCA1_Z75
  COMPILE: 'False'
  VERSION: dev-marc/DE_CY48R1.0_climateDT_develop
  INPUTS: '%HPCROOTDIR%/%PROJECT.PROJECT_DESTINATION%/dvc-cache-de340'
  DVC_INPUTS_BRANCH: workflow/nemo-standalone-dvc
  # So that it checks out the branch that you need
  USE_FIXED_DVC_COMMIT: 'False'
  PATH: '%CONFIGURATION.HPC_PROJECT_DIR%/models/%MODEL.NAME%/%MODEL.VERSION%'
CONFIGURATION:
  DATA_PORTFOLIO: full
  NEMO_TPN: 64
  XIOS_TPN: 4
  NEMO:
    IO_NODES: 3
JOBS:
  SIM:
    QUEUE: gp_debug
    DEPENDENCIES: INI SIM-1
    WALLCLOCK: 00:30
    NODES: 4
    TASKS: 8
    THREADS: 7
    RETRIALS: 3
  REMOTE_SETUP:
    QUEUE: gp_debug
  INI:
    QUEUE: gp_debug
EXPERIMENT:
  DATELIST: 20150101
  CHUNKSIZEUNIT: day
  CHUNKSIZE: 1
  NUMCHUNKS: 2
  CALENDAR: standard
